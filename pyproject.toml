[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-tastytrade-server"
version = "0.1.0"
description = "MCP server for the TastyTrade brokerage API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
mcp-tastytrade = "mcp_tastytrade.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_tastytrade"]
